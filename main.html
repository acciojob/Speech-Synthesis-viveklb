<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Speech Synthesis</title>

  <link
    href="https://fonts.googleapis.com/css?family=Pacifico"
    rel="stylesheet"
    type="text/css"
  >

  <style>
    html {
      font-size: 10px;
      box-sizing: border-box;
    }

    *,
    *:before,
    *:after {
      box-sizing: inherit;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background-color: #3BC1AC;

      display: flex;
      min-height: 100vh;
      align-items: center;

      background-image:
        radial-gradient(circle at 100% 150%,
          #3BC1AC 24%,
          #42D2BB 25%,
          #42D2BB 28%,
          #3BC1AC 29%,
          #3BC1AC 36%,
          #42D2BB 36%,
          #42D2BB 40%,
          transparent 40%,
          transparent),

        radial-gradient(circle at 0 150%,
          #3BC1AC 24%,
          #42D2BB 25%,
          #42D2BB 28%,
          #3BC1AC 29%,
          #3BC1AC 36%,
          #42D2BB 36%,
          #42D2BB 40%,
          transparent 40%,
          transparent),

        radial-gradient(circle at 50% 100%,
          #42D2BB 10%,
          #3BC1AC 11%,
          #3BC1AC 23%,
          #42D2BB 24%,
          #42D2BB 30%,
          #3BC1AC 31%,
          #3BC1AC 43%,
          #42D2BB 44%,
          #42D2BB 50%,
          #3BC1AC 51%,
          #3BC1AC 63%,
          #42D2BB 64%,
          #42D2BB 71%,
          transparent 71%,
          transparent),

        radial-gradient(circle at 100% 50%,
          #42D2BB 5%,
          #3BC1AC 6%,
          #3BC1AC 15%,
          #42D2BB 16%,
          #42D2BB 20%,
          #3BC1AC 21%,
          #3BC1AC 30%,
          #42D2BB 31%,
          #42D2BB 35%,
          #3BC1AC 36%,
          #3BC1AC 45%,
          #42D2BB 46%,
          #42D2BB 49%,
          transparent 50%,
          transparent),

        radial-gradient(circle at 0 50%,
          #42D2BB 5%,
          #3BC1AC 6%,
          #3BC1AC 15%,
          #42D2BB 16%,
          #42D2BB 20%,
          #3BC1AC 21%,
          #3BC1AC 30%,
          #42D2BB 31%,
          #42D2BB 35%,
          #3BC1AC 36%,
          #3BC1AC 45%,
          #42D2BB 46%,
          #42D2BB 49%,
          transparent 50%,
          transparent);

      background-size: 100px 50px;
    }

    .voiceinator {
      padding: 2rem;
      width: 50rem;
      max-width: 95%;
      margin: 0 auto;
      border-radius: 1rem;
      position: relative;
      background: white;
      overflow: hidden;
      z-index: 1;
      box-shadow: 0 0 5px 5px rgba(0, 0, 0, 0.1);
    }

    h1 {
      width: calc(100% + 4rem);
      margin: -2rem 0 2rem -2rem;
      padding: 0.5rem;

      background: #ffc600;
      border-bottom: 5px solid #F3C010;

      text-align: center;
      font-size: 5rem;
      font-weight: 100;
      font-family: 'Pacifico', cursive;
      text-shadow: 3px 3px 0 #F3C010;
    }

    label {
      font-size: 1.8rem;
      font-weight: bold;
    }

    .voiceinator input,
    .voiceinator button,
    .voiceinator select,
    .voiceinator textarea {
      width: 100%;
      display: block;
      margin: 10px 0;
      padding: 10px;
      border: 0;
      font-size: 2rem;
      background: #F7F7F7;
      outline: 0;
    }

    textarea {
      height: 20rem;
      resize: vertical;
    }

    .voiceinator button {
      background: #ffc600;
      border: 0;
      width: 49%;
      float: left;

      font-family: 'Pacifico', cursive;
      margin-bottom: 0;
      font-size: 2rem;

      border-bottom: 5px solid #F3C010;
      cursor: pointer;
      position: relative;
    }

    .voiceinator button:active {
      top: 2px;
    }

    .voiceinator button:nth-of-type(1) {
      margin-right: 2%;
    }

    #message {
      clear: both;
      padding-top: 15px;
      text-align: center;
      font-size: 1.6rem;
    }
  </style>
</head>

<body>

  <div class="voiceinator">

    <h1>The Voiceinator 5000</h1>

    <select name="voice" id="voices">
      <option value="">Select A Voice</option>
    </select>

    <label for="rate">Rate:</label>

    <input
      id="rate"
      name="rate"
      type="range"
      min="0"
      max="3"
      value="1"
      step="0.1"
    >

    <label for="pitch">Pitch:</label>

    <input
      id="pitch"
      name="pitch"
      type="range"
      min="0"
      max="2"
      value="1"
      step="0.1"
    >

    <textarea name="text">Hello! I love JavaScript 👍</textarea>

    <button id="stop">Stop!</button>
    <button id="speak">Speak</button>

    <div id="message"></div>

  </div>


  <script>
    const msg = new SpeechSynthesisUtterance();

    let voices = [];

    const synth = window.speechSynthesis;

    const voicesDropdown =
      document.querySelector('[name="voice"]');

    const options =
      document.querySelectorAll(
        '[type="range"], [name="text"]'
      );

    const speakButton =
      document.querySelector('#speak');

    const stopButton =
      document.querySelector('#stop');

    const textArea =
      document.querySelector('[name="text"]');

    const rateInput =
      document.querySelector('[name="rate"]');

    const pitchInput =
      document.querySelector('[name="pitch"]');

    const message =
      document.querySelector('#message');


    /*
      LOAD VOICES
    */
    function populateVoices() {

      voices = synth.getVoices();

      voicesDropdown.innerHTML =
        '<option value="">Select A Voice</option>';

      if (voices.length === 0) {

        message.textContent =
          'No voices available.';

        return;
      }

      message.textContent = '';

      voices.forEach(function (voice) {

        const option =
          document.createElement('option');

        option.value = voice.name;

        option.textContent =
          `${voice.name} (${voice.lang})`;

        voicesDropdown.appendChild(option);

      });

    }


    /*
      SET SELECTED VOICE
    */
    function setVoice() {

      msg.voice = voices.find(
        voice =>
          voice.name === this.value
      ) || null;

      /*
        Restart only when speech is
        currently active.
      */
      if (
        synth.speaking ||
        synth.pending
      ) {
        toggle(true);
      }

    }


    /*
      START / STOP SPEECH
    */
    function toggle(startOver = true) {

      /*
        STOP
      */
      if (startOver === false) {

        synth.cancel();

        message.textContent = '';

        return;
      }


      /*
        IMPORTANT FIX:
        Refresh voices before attempting
        to start speech.
      */
      voices = synth.getVoices();


      /*
        If no voice exists, STOP here.

        speechSynthesis.speak() will NOT
        be called.
      */
      if (voices.length === 0) {

        synth.cancel();

        message.textContent =
          'No voices available.';

        return;
      }


      /*
        Check text.
      */
      const text =
        textArea.value.trim();

      if (text === '') {

        message.textContent =
          'Please enter some text.';

        return;
      }


      /*
        Set utterance values.
      */
      msg.text = text;

      msg.rate =
        Number(rateInput.value);

      msg.pitch =
        Number(pitchInput.value);


      /*
        Set currently selected voice.
      */
      if (voicesDropdown.value) {

        const selectedVoice =
          voices.find(
            voice =>
              voice.name ===
              voicesDropdown.value
          );

        if (selectedVoice) {
          msg.voice = selectedVoice;
        }

      }


      /*
        Stop old speech if necessary.
      */
      if (
        synth.speaking ||
        synth.pending
      ) {

        synth.cancel();

        setTimeout(function () {

          /*
            Check voices again before speak.
          */
          if (synth.getVoices().length > 0) {

            synth.speak(msg);

            message.textContent =
              'Speaking...';
          }

        }, 50);

      } else {

        /*
          Speak only if voices are available.
        */
        if (synth.getVoices().length > 0) {

          synth.speak(msg);

          message.textContent =
            'Speaking...';
        }

      }

    }


    /*
      RATE / PITCH UPDATE
    */
    function setOption() {

      if (this.name === 'rate') {

        msg.rate =
          Number(this.value);

      }

      else if (this.name === 'pitch') {

        msg.pitch =
          Number(this.value);

      }

      else if (this.name === 'text') {

        msg.text =
          this.value;

      }


      /*
        Restart if currently speaking.
      */
      if (
        (this.name === 'rate' ||
         this.name === 'pitch') &&
        (synth.speaking ||
         synth.pending)
      ) {

        toggle(true);

      }

    }


    /*
      INITIAL VALUES
    */
    msg.text = textArea.value;
    msg.rate = Number(rateInput.value);
    msg.pitch = Number(pitchInput.value);


    /*
      LOAD VOICES
    */
    populateVoices();


    /*
      Voices are loaded asynchronously
      in browsers such as Chrome.
    */
    synth.addEventListener(
      'voiceschanged',
      populateVoices
    );


    /*
      VOICE CHANGE
    */
    voicesDropdown.addEventListener(
      'change',
      setVoice
    );


    /*
      RATE, PITCH AND TEXT
    */
    options.forEach(function (option) {

      option.addEventListener(
        'change',
        setOption
      );

    });


    /*
      SPEAK
    */
    speakButton.addEventListener(
      'click',
      function () {

        toggle(true);

      }
    );


    /*
      STOP
    */
    stopButton.addEventListener(
      'click',
      function () {

        toggle(false);

      }
    );

  </script>

</body>
</html>
